name: Azure Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod
      deploy_chroma:
        description: "Deploy Chroma container app"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      deploy_api:
        description: "Deploy API container app"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      deploy_ui:
        description: "Deploy UI container app (needs ./ui in repo)"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  CHROMA_IMAGE: chromadb/chroma:1.5.0
  API_PORT: "8001"
  UI_PORT: "8050"
  CHROMA_PORT: "8000"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      # Image refs include the ACR host; GitHub skips job outputs that match secrets (e.g. ACR_NAME).
      # Pass only tags; deploy reconstructs ${{ registry }}/quack-api:${{ tag }}.
      api_image_tag: ${{ steps.images.outputs.api_image_tag }}
      ui_image_tag: ${{ steps.images.outputs.ui_image_tag }}
      target_env: ${{ steps.target.outputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target env
        id: target
        run: echo "target_env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"

      - name: Normalize ACR name
        run: |
          set -euo pipefail
          raw="${ACR_NAME:-}"
          name="${raw#https://}"
          name="${name#http://}"
          name="${name%.azurecr.io}"
          name="${name%/}"
          if [[ ! "$name" =~ ^[a-zA-Z0-9]{5,50}$ ]]; then
            echo "::error::ACR_NAME secret must be the registry resource name only: 5-50 alphanumeric characters (see .github/README.md). We strip .azurecr.io if present. After normalizing: '${name:-empty}'"
            exit 1
          fi
          echo "ACR_NAME=$name" >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        if: ${{ github.event.inputs.deploy_api == 'true' || github.event.inputs.deploy_ui == 'true' }}
        run: az acr login --name "$ACR_NAME"

      - name: Build and push API + UI images
        id: images
        run: |
          set -euo pipefail
          LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          SHORT_SHA="${GITHUB_SHA::7}"
          TARGET_ENV="${{ steps.target.outputs.target_env }}"
          DEPLOY_API="${{ github.event.inputs.deploy_api }}"
          DEPLOY_UI="${{ github.event.inputs.deploy_ui }}"

          if [ "$DEPLOY_API" = "true" ]; then
            TAG="${TARGET_ENV}-${SHORT_SHA}"
            API_IMAGE="$LOGIN_SERVER/quack-api:$TAG"
            docker build -f api/Dockerfile -t "$API_IMAGE" .
            docker push "$API_IMAGE"
            # Also push :latest so existing Container Apps that still reference latest (e.g. manual setup) resolve.
            docker tag "$API_IMAGE" "$LOGIN_SERVER/quack-api:latest"
            docker push "$LOGIN_SERVER/quack-api:latest"
            echo "api_image_tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "api_image_tag=" >> "$GITHUB_OUTPUT"
          fi

          if [ "$DEPLOY_UI" = "true" ]; then
            if [ ! -d ui ]; then
              echo "::error::deploy_ui is enabled but there is no ./ui directory in this repo. Disable deploy_ui or add the UI package."
              exit 1
            fi
            TAG="${TARGET_ENV}-${SHORT_SHA}"
            UI_IMAGE="$LOGIN_SERVER/quack-ui:$TAG"
            docker build -f Dockerfile.ui -t "$UI_IMAGE" .
            docker push "$UI_IMAGE"
            docker tag "$UI_IMAGE" "$LOGIN_SERVER/quack-ui:latest"
            docker push "$LOGIN_SERVER/quack-ui:latest"
            echo "ui_image_tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ui_image_tag=" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      # Repository variables (+ optional *_DEV / *_PROD). See .github/README.md
      AZURE_RESOURCE_GROUP: ${{ (needs.build-and-push.outputs.target_env == 'prod' && (vars.AZURE_RESOURCE_GROUP_PROD || vars.AZURE_RESOURCE_GROUP)) || (needs.build-and-push.outputs.target_env == 'dev' && (vars.AZURE_RESOURCE_GROUP_DEV || vars.AZURE_RESOURCE_GROUP)) || vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ (needs.build-and-push.outputs.target_env == 'prod' && (vars.AZURE_LOCATION_PROD || vars.AZURE_LOCATION)) || (needs.build-and-push.outputs.target_env == 'dev' && (vars.AZURE_LOCATION_DEV || vars.AZURE_LOCATION)) || vars.AZURE_LOCATION }}
      AZURE_CONTAINERAPPS_ENV: ${{ (needs.build-and-push.outputs.target_env == 'prod' && (vars.AZURE_CONTAINERAPPS_ENV_PROD || vars.AZURE_CONTAINERAPPS_ENV)) || (needs.build-and-push.outputs.target_env == 'dev' && (vars.AZURE_CONTAINERAPPS_ENV_DEV || vars.AZURE_CONTAINERAPPS_ENV)) || vars.AZURE_CONTAINERAPPS_ENV }}
      APP_NAME_CHROMA: ${{ (needs.build-and-push.outputs.target_env == 'prod' && (vars.APP_NAME_CHROMA_PROD || vars.APP_NAME_CHROMA)) || (needs.build-and-push.outputs.target_env == 'dev' && (vars.APP_NAME_CHROMA_DEV || vars.APP_NAME_CHROMA)) || vars.APP_NAME_CHROMA }}
      APP_NAME_API: ${{ (needs.build-and-push.outputs.target_env == 'prod' && (vars.APP_NAME_API_PROD || vars.APP_NAME_API)) || (needs.build-and-push.outputs.target_env == 'dev' && (vars.APP_NAME_API_DEV || vars.APP_NAME_API)) || vars.APP_NAME_API }}
      APP_NAME_UI: ${{ (needs.build-and-push.outputs.target_env == 'prod' && (vars.APP_NAME_UI_PROD || vars.APP_NAME_UI)) || (needs.build-and-push.outputs.target_env == 'dev' && (vars.APP_NAME_UI_DEV || vars.APP_NAME_UI)) || vars.APP_NAME_UI }}
    steps:
      - name: Require Azure repository variables
        run: |
          set -euo pipefail
          for n in AZURE_RESOURCE_GROUP AZURE_LOCATION AZURE_CONTAINERAPPS_ENV APP_NAME_CHROMA APP_NAME_API APP_NAME_UI; do
            eval "v=\${$n-}"
            if [ -z "$v" ]; then
              echo "::error::$n is empty. Set repository Actions → Variables (see .github/README.md)."
              exit 1
            fi
          done

      - name: Normalize ACR name
        run: |
          set -euo pipefail
          raw="${ACR_NAME:-}"
          name="${raw#https://}"
          name="${name#http://}"
          name="${name%.azurecr.io}"
          name="${name%/}"
          if [[ ! "$name" =~ ^[a-zA-Z0-9]{5,50}$ ]]; then
            echo "::error::ACR_NAME secret must be the registry resource name only: 5-50 alphanumeric characters (.github/README.md). After normalizing: '${name:-empty}'"
            exit 1
          fi
          echo "ACR_NAME=$name" >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp extension
        run: |
          az extension add --name containerapp --upgrade --yes

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION"

      - name: Ensure container apps environment exists
        run: |
          if ! az containerapp env show \
            --name "$AZURE_CONTAINERAPPS_ENV" \
            --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp env create \
              --name "$AZURE_CONTAINERAPPS_ENV" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION"
          fi

      - name: Resolve environment flags
        id: flags
        run: |
          set -euo pipefail
          echo "deploy_chroma=${{ github.event.inputs.deploy_chroma }}" >> "$GITHUB_OUTPUT"
          echo "deploy_api=${{ github.event.inputs.deploy_api }}" >> "$GITHUB_OUTPUT"
          echo "deploy_ui=${{ github.event.inputs.deploy_ui }}" >> "$GITHUB_OUTPUT"

      - name: Deploy Chroma (internal ingress)
        if: ${{ steps.flags.outputs.deploy_chroma == 'true' }}
        run: |
          set -euo pipefail
          if az containerapp show --name "$APP_NAME_CHROMA" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update \
              --name "$APP_NAME_CHROMA" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$CHROMA_IMAGE" \
              --set-env-vars APP_ENV="${{ needs.build-and-push.outputs.target_env }}"
            az containerapp ingress update \
              --name "$APP_NAME_CHROMA" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --type internal \
              --target-port "$CHROMA_PORT" \
              --transport auto
          else
            az containerapp create \
              --name "$APP_NAME_CHROMA" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$AZURE_CONTAINERAPPS_ENV" \
              --image "$CHROMA_IMAGE" \
              --ingress internal \
              --target-port "$CHROMA_PORT" \
              --min-replicas 1 \
              --max-replicas 1 \
              --env-vars APP_ENV="${{ needs.build-and-push.outputs.target_env }}"
          fi

      - name: Deploy API
        if: ${{ steps.flags.outputs.deploy_api == 'true' }}
        run: |
          set -euo pipefail
          LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          TAG="${{ needs.build-and-push.outputs.api_image_tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::api_image_tag is empty — enable Deploy API in workflow dispatch so the image is built."
            exit 1
          fi
          API_IMAGE="$LOGIN_SERVER/quack-api:$TAG"
          ACR_USER="$(az acr credential show --name "$ACR_NAME" --query username -o tsv)"
          ACR_PASS="$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' -o tsv)"

          AZURE_OPENAI_API_KEY_RAW="${{ secrets.AZURE_OPENAI_API_KEY }}"

          if az containerapp show --name "$APP_NAME_API" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update \
              --name "$APP_NAME_API" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$API_IMAGE"
          else
            az containerapp create \
              --name "$APP_NAME_API" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$AZURE_CONTAINERAPPS_ENV" \
              --image "$API_IMAGE" \
              --ingress external \
              --target-port "$API_PORT" \
              --registry-server "$LOGIN_SERVER" \
              --registry-username "$ACR_USER" \
              --registry-password "$ACR_PASS" \
              --min-replicas 1 \
              --max-replicas 3
          fi

          az containerapp secret set \
            --name "$APP_NAME_API" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets \
              "azure-openai-api-key=$AZURE_OPENAI_API_KEY_RAW"

          az containerapp update \
            --name "$APP_NAME_API" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars \
              APP_ENV="${{ needs.build-and-push.outputs.target_env }}" \
              API_HOST="0.0.0.0" \
              API_PORT="$API_PORT" \
              AZURE_OPENAI_ENDPOINT="${{ vars.AZURE_OPENAI_ENDPOINT }}" \
              CHROMADB_HOST="${{ vars.CHROMADB_HOST }}" \
              CHROMADB_PORT="${{ vars.CHROMADB_PORT }}" \
              ENTRA_AUDIENCE="${{ vars.ENTRA_AUDIENCE }}" \
              ENTRA_ISSUER="${{ vars.ENTRA_ISSUER }}" \
              ENTRA_JWKS_URL="${{ vars.ENTRA_JWKS_URL }}" \
              ENTRA_AUTO_PROVISION_TIER="${{ vars.ENTRA_AUTO_PROVISION_TIER }}" \
              AUTH_DISABLED="${{ vars.AUTH_DISABLED }}" \
              DEV_IMPERSONATE_USER_EMAIL="${{ vars.DEV_IMPERSONATE_USER_EMAIL }}" \
              AZURE_OPENAI_API_KEY="secretref:azure-openai-api-key"

      - name: Deploy UI
        if: ${{ steps.flags.outputs.deploy_ui == 'true' }}
        run: |
          set -euo pipefail
          LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          TAG="${{ needs.build-and-push.outputs.ui_image_tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::ui_image_tag is empty — enable Deploy UI only when ./ui exists and build ran."
            exit 1
          fi
          UI_IMAGE="$LOGIN_SERVER/quack-ui:$TAG"
          ACR_USER="$(az acr credential show --name "$ACR_NAME" --query username -o tsv)"
          ACR_PASS="$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' -o tsv)"

          if az containerapp show --name "$APP_NAME_UI" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update \
              --name "$APP_NAME_UI" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$UI_IMAGE"
          else
            az containerapp create \
              --name "$APP_NAME_UI" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$AZURE_CONTAINERAPPS_ENV" \
              --image "$UI_IMAGE" \
              --ingress external \
              --target-port "$UI_PORT" \
              --registry-server "$LOGIN_SERVER" \
              --registry-username "$ACR_USER" \
              --registry-password "$ACR_PASS" \
              --min-replicas 1 \
              --max-replicas 3
          fi

          az containerapp update \
            --name "$APP_NAME_UI" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars \
              APP_ENV="${{ needs.build-and-push.outputs.target_env }}" \
              UI_HOST="0.0.0.0" \
              UI_PORT="$UI_PORT" \
              API_BASE_URL="${{ vars.UI_API_BASE_URL }}" \
              ENABLE_UI_INGEST="${{ vars.ENABLE_UI_INGEST }}" \
              COLLECTIONS="${{ vars.COLLECTIONS }}" \
              DEFAULT_COLLECTION="${{ vars.DEFAULT_COLLECTION }}"


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quack_db"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4.0",
    "dash>=2.18.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "pypdf>=4.0.0",
    "PyJWT>=2.10.0",
    "python-docx>=1.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "uvicorn>=0.35.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
]

[project.scripts]
quack-ingest = "quack_db.ingest.cli:main"
quack-query = "quack_db.cli.query_local:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quack_db*"]

[tool.setuptools.package-data]
quack_db = ["config.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "api", "src/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = [".", "src"]
